name: APPZPOS database integration

on:
  push:
    branches:
      - appzpos-db-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appzpos-application:
    name: APPZPOS application and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify sanitized APPZPOS mapping fixtures
        run: npx vitest run lib/pos/appzpos/appzpos.test.ts

      - name: Verify canonical migration source chain
        run: node scripts/test-canonical-migration-chain.cjs

      - name: Run repository tests and canonical migration checks
        run: npm test

      - name: Typecheck
        if: always()
        run: npm run typecheck

      - name: ESLint
        if: always()
        run: npm run lint

      - name: Production build
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build

      - name: Check patch whitespace
        if: always()
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD

  appzpos-database:
    name: Canonical migrations and APPZPOS SQL/RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector

      - name: Rebuild from complete canonical migration chain
        run: supabase db reset --local

      # This repository test is a transactional SQL assertion script, not a
      # pgTAP suite, so run it directly and fail on the first SQL error.
      - name: Run APPZPOS SQL integration and RLS test
        run: >-
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/appzpos_getorders_partner_integration.sql

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
